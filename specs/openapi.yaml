  /projects/{project_id}/charts/{chart_name}:
    get:
      summary: Get chart data
      description: >-
        Returns time-series data for a specific chart.


        **Response Structure**


        The response includes:

        - Chart metadata (category, display_name, description)

        - Time boundaries (start_date, end_date, last_computed_at)

        - Data values (array of data points)

        - Summary statistics

        - Segment information (when segmented)


        **Chart Types**


        Different charts may return data in slightly different formats:

        - Standard charts: values as arrays of data points with timestamps

        - Segmented charts: include segment information in the response

        - Cohort charts: see below


        **Cohort charts**


        Cohort-shaped charts (`cohort_explorer`, `prediction_explorer`,
        `subscription_retention`, ...)

        return `values` as `{cohort, period, value}` objects, where `period` is
        the **index into the

        `periods` array**, not a month number. Two things follow from that:


        - `periods[0]` describes the **cohort size** — a count of customers or
        subscriptions, with unit
          `#`. It is not the measure at month 0. On `cohort_explorer` its `display_name` is named after
          the `cohorting_date` selector (e.g. `New customers`).
        - The measure starts at `period: 1`, labelled by
        `periods[1].display_name` (typically `Month 0`).
          So `Month N` is at `period: N + 1`.

        Always read `periods[period].display_name`, `.unit` and `.scale` to
        interpret a data point rather

        than assuming `period` is the month number. On non-realtime charts
        (`realtime=false`) the same

        metadata is returned in `segments` instead of `periods`.


        **Filtering and Segmentation**


        Use the `/charts/{chart_name}/options` endpoint to discover available

        filters and segments for a specific chart before making requests.


        Segments and filters vary per chart and are separate lists — a dimension

        can be available as a filter but not as a segment. Requesting an

        unsupported segment or filter (or segmenting/filtering a chart that does

        not allow it) returns a 400 `parameter_error` that lists the supported

        segments. Check `get-chart-options-schema` first when unsure.


        Filter parameters vary by chart and can be passed as additional query
        parameters.


        **Aggregation**


        Use `aggregate` to request summary-only output for supported charts.

        When `aggregate` is provided, `values` is returned as an empty array and

        `summary` includes only the requested aggregate operations.


        **Incomplete data**

        For the most recent periods, data may be flagged as incomplete, and may
        not be appropriate to use for analysis.
         This endpoint requires the following permission(s): <code>charts_metrics:charts:read</code>. This endpoint belongs to the <strong>Charts & Metrics</strong> domain, which has a default rate limit of <strong>25 requests per minute</strong>.
      operationId: get-chart-data
      x-revenuecat-rate-limiting-domain: charts_metrics
      x-scopes:
        - charts_metrics:charts:read
      x-release-status: public
      tags:
        - Charts & Metrics
      parameters:
        - name: project_id
          description: ID of the project
          required: true
          in: path
          schema:
            type: string
            maxLength: 255
            example: proj1ab2c3d4
        - name: chart_name
          description: >
            Name of the chart to retrieve:

            - actives: Active (paying) subscriptions 

            - actives_movement: Period-over-period delta of active (paying)
            subscriptions

            - actives_new: New paying subscriptions, including trial
            conversions, resubscriptions, and product changes

            - arr: Annual recurring revenue

            - churn: Churn rate: active and expired subscriptions per period

            - cohort_explorer: allows measuring the performance of various
            cohort definitions over time for revenue, retained subscriptions,
            subscriptions that are still set to renew (not cancelled), and
            cohort LTV

            - conversion_to_paying: Conversion of new customers to paying

            - customers_new: Newly seen customers

            - initial_conversion: Initial conversion of new customers to paying
            within fixed windows (0, 3, 7, 14, 30 days, and unbounded)

            - ltv_per_customer: Realized LTV per customer, also known as ARPU,
            cohorted by first seen date

            - ltv_per_paying_customer: Realized LTV per paying customer, also
            known as ARPPU, cohorted by first seen date

            - mrr: Monthly recurring revenue

            - mrr_movement: Period-over-period delta of monthly recurring
            revenue

            - prediction_explorer: similar to cohort_explorer but including
            future predictions

            - refund_rate: transactions per period, refunds, refund rate

            - refund_request: App Store and Google Play refund and chargeback
            events per period, broken down by resolution status (granted,
            declined, reversed, pending)

            - refunds: Refunded revenue and number of refunded transactions per
            period, by refund date (realtime only)

            - revenue: revenue (gross, net of taxes, or proceeds net of taxes
            and commissions) and number of transactions (subscriptions and
            non-subscriptions) per period

            - subscription_retention: Per-period retention of paying
            subscriptions by duration

            - subscription_status: Break down paying subscriptions, trials, MRR,
            ARR, or revenue by whether the subscription is set to renew,
            cancelled, or in billing recovery

            - trials: Active trials

            - trials_movement: Movement of active trials

            - trials_new: New trials

            - customers_active: Customers seen during the period (also known as
            DAU/MAU/WAU/etc.) (realtime only)

            - trial_conversion: Trial conversion funnel from new customers to
            trials started to paying subscriptions, cohorted by first seen date

            - trial_conversion_rate: Number of trials started in a period and
            ratio of them converting to paying (realtime only)

            - trial_cancellation: Portion of trials started in a period that
            were cancelled and expired without converting to paid (realtime
            only)

            - non-subscription_purchases: Number of non-subscription purchases
            per period

            - ad_revenue: Estimated ad revenue per period (realtime only)

            - ad_impressions: Number of ad impressions per period (realtime
            only)

            - ad_clicks: Number of ad clicks per period (realtime only)

            - ad_monetized_customers: Customers who saw at least one monetized
            ad during the period, also known as daily ad-monetized users
            (realtime only)

            - ad_arpdau: Average ad revenue per daily ad-monetized customer
            (realtime only)

            - ad_rpm: Effective cost per mille (eCPM): ad revenue per thousand
            impressions (realtime only)

            - ad_fill_rate: Ratio of ad requests that were filled with an ad
            (realtime only)

            - ad_ctr: Ad click-through rate: clicks over impressions (realtime
            only)

            - paywall_encounter: Share of new customers who encounter a paywall
            within 0, 1, 3, 7, or 14 days, cohorted by first seen date (realtime
            only)

            - paywall_conversion: Conversion of paywall impressions into
            initial, paid, and trial conversions, cohorted by first impression
            date (realtime only)

            - paywall_ltv: Realized LTV attributed to paywall impressions that
            led to an initial conversion, cohorted by first impression date
            (realtime only)

            - paywall_abandonment: Share of paywall impressions with no initial
            conversion, split into bounces and purchase cancellations (realtime
            only)

            - app_store_save_outcomes: Saved Apple retention messages per
            period, broken down by outcome (promotional offer redeemed,
            alternate plan redeemed, no purchase) (realtime only)


            Charts marked as realtime only are served exclusively by Charts v3
            and

            require `realtime=true` (the default).
          required: true
          in: path
          schema:
            type: string
            maxLength: 255
            enum:
              - actives
              - actives_movement
              - actives_new
              - arr
              - churn
              - cohort_explorer
              - conversion_to_paying
              - customers_new
              - initial_conversion
              - ltv_per_customer
              - ltv_per_paying_customer
              - mrr
              - mrr_movement
              - prediction_explorer
              - refund_rate
              - refund_request
              - refunds
              - revenue
              - subscription_retention
              - subscription_status
              - trials
              - trials_movement
              - trials_new
              - customers_active
              - trial_conversion
              - trial_conversion_rate
              - trial_cancellation
              - non-subscription_purchases
              - ad_revenue
              - ad_impressions
              - ad_clicks
              - ad_monetized_customers
              - ad_arpdau
              - ad_rpm
              - ad_fill_rate
              - ad_ctr
              - paywall_encounter
              - paywall_conversion
              - paywall_ltv
              - paywall_abandonment
              - app_store_save_outcomes
            example: revenue
        - name: realtime
          description: >-
            Whether to request real-time (v3) charts. Defaults to true. Set to
            false to request the v2 charts.
          in: query
          schema:
            type: boolean
            default: true
        - name: filters
          description: JSON array of chart filters. Each filter is a ChartFilter object.
          in: query
          schema:
            type: string
          example: '[{"name":"country","values":["US","UK"]}]'
        - name: selectors
          description: JSON object of chart selectors.
          in: query
          schema:
            type: string
          example: '{"conversion_timeframe":"7_days","revenue_type":"proceeds"}'
        - name: aggregate
          description: >
            Comma-separated aggregate operations to return in `summary` without
            raw `values`.
          in: query
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - average
                - total
            example: average,total
        - name: currency
          description: The currency to return metrics data in
          in: query
          schema:
            type: string
            enum:
              - USD
              - EUR
              - GBP
              - AUD
              - CAD
              - JPY
              - BRL
              - KRW
              - CNY
              - MXN
              - SEK
              - PLN
              - NZD
              - CHF
          example: EUR
        - name: resolution
          description: >
            Time resolution for the chart data.

            Use the chart options endpoint to discover available resolutions and
            their IDs.
          in: query
          schema:
            type: string
            example: '0'
        - name: start_date
          description: Start date for the data range (ISO 8601 format)
          in: query
          schema:
            type: string
            format: date
            example: '2024-01-01'
        - name: end_date
          description: End date for the data range (ISO 8601 format)
          in: query
          schema:
            type: string
            format: date
            example: '2024-12-31'
        - name: expand_periods
          description: >-
            Whether to expand the date range so the first period is complete
            (e.g. snap a weekly range back to the start of the week). Defaults
            to false, which only includes data from the exact start_date
            provided. Period labels are always aligned to period boundaries:
            with expand_periods=false and a mid-period start_date, the first
            period only aggregates data from start_date onwards and is marked as
            incomplete. Exception: charts of point-in-time (stock) metrics, such
            as active subscriptions or MRR, ignore this parameter entirely.
            Their values are snapshots measured exactly at each period boundary,
            so the first data point is always measured at the start of the
            period containing start_date (which can fall before start_date) and
            is not marked as incomplete, since a snapshot cannot be partial.
          in: query
          schema:
            type: boolean
            default: false
        - name: segment
          description: >
            Segment the data by this dimension. Must be one of the segments
            returned

            by the chart options schema endpoint for this chart; segments vary
            per

            chart, and unsupported segments return a 400 `parameter_error`
            listing

            the supported ones.
          in: query
          schema:
            type: string
            example: country
        - name: limit_num_segments
          description: >
            If set, limits the number of segments returned to the top N by
            value.

            All remaining segments are aggregated into an "Other" segment.

            Only applies when a segment is specified.
          in: query
          schema:
            type: integer
            minimum: 1
            example: 10
        - name: include_annotations
          in: query
          required: false
          description: >-
            When true, includes chart annotations for the project in the
            response, filtered to the chart's date window.
          schema:
            type: boolean
            default: false
            example: true
      responses:
        '200':
          description: Chart data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'
          headers:
            RevenueCat-Rate-Limit-Current-Usage:
              $ref: '#/components/headers/RateLimitCurrentUsage'
            RevenueCat-Rate-Limit-Current-Limit:
              $ref: '#/components/headers/RateLimitCurrentLimit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/InternalError'
