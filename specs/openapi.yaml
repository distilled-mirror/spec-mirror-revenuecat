  /projects/{project_id}/charts/{chart_name}/subscriber_list_exports:
    post:
      summary: Create a chart subscriber list export
      description: >-
        Queues an async export of the full subscriber list behind a chart: every

        customer with activity contributing to the chart during the requested

        period. The export is delivered as a zip archive containing a CSV with
        one

        row per customer (`app_user_id`, `country`, `app_uuid`, `status`,

        `product_identifier`, `first_seen_at`, `last_seen_at`). Projects not yet

        migrated to the zip format receive a gzipped CSV instead, with columns

        `user_uuid`, `country`, `app_uuid`, `status`, `product`, `first_seen`,

        `last_seen`.


        The export runs asynchronously: this endpoint returns `202 Accepted`
        with

        the export job, and the file is built in the background. Poll the export

        with `GET
        /projects/{project_id}/charts/{chart_name}/subscriber_list_exports/{export_id}`

        until its status is `succeeded`, then download the file from

        `download_url`. A download link is also emailed to the project owner.


        Only realtime (Charts v3) charts backed by ClickHouse support subscriber

        list exports. The chart parameters (`resolution`, `start_date`,

        `end_date`, `filters`, `selectors`, `segment`) work like in

        `GET /charts/{chart_name}` and define the exported population.


        Only one export with identical settings can run at a time; a duplicate

        request returns `423 Locked` while the first one is still running.
         This endpoint requires the following permission(s): <code>charts_metrics:subscriber_lists:read_write</code>. This endpoint belongs to the <strong>Charts & Metrics</strong> domain, which has a default rate limit of <strong>25 requests per minute</strong>.
      operationId: create-chart-subscriber-list-export
      x-revenuecat-rate-limiting-domain: charts_metrics
      x-scopes:
        - charts_metrics:subscriber_lists:read_write
      x-release-status: beta
      x-revenuecat-release-gatekeeping: false
      tags:
        - Charts & Metrics
      parameters:
        - name: project_id
          description: ID of the project
          required: true
          in: path
          schema:
            type: string
            maxLength: 255
            example: proj1ab2c3d4
        - name: chart_name
          description: >
            Name of the chart to retrieve:

            - actives: Active (paying) subscriptions 

            - actives_movement: Period-over-period delta of active (paying)
            subscriptions

            - actives_new: New paying subscriptions, including trial
            conversions, resubscriptions, and product changes

            - arr: Annual recurring revenue

            - churn: Churn rate: active and expired subscriptions per period

            - cohort_explorer: allows measuring the performance of various
            cohort definitions over time for revenue, retained subscriptions,
            subscriptions that are still set to renew (not cancelled), and
            cohort LTV

            - conversion_to_paying: Conversion of new customers to paying

            - customers_new: Newly seen customers

            - initial_conversion: Initial conversion of new customers to paying
            within fixed windows (0, 3, 7, 14, 30 days, and unbounded)

            - ltv_per_customer: Realized LTV per customer, also known as ARPU,
            cohorted by first seen date

            - ltv_per_paying_customer: Realized LTV per paying customer, also
            known as ARPPU, cohorted by first seen date

            - mrr: Monthly recurring revenue

            - mrr_movement: Period-over-period delta of monthly recurring
            revenue

            - prediction_explorer: similar to cohort_explorer but including
            future predictions

            - refund_rate: transactions per period, refunds, refund rate

            - refund_request: App Store and Google Play refund and chargeback
            events per period, broken down by resolution status (granted,
            declined, reversed, pending)

            - refunds: Refunded revenue and number of refunded transactions per
            period, by refund date (realtime only)

            - revenue: revenue (gross, net of taxes, or proceeds net of taxes
            and commissions) and number of transactions (subscriptions and
            non-subscriptions) per period

            - subscription_retention: Per-period retention of paying
            subscriptions by duration

