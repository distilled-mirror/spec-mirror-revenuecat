    CreateAppStoreConnectInAppPurchaseInput:
      type: object
      properties: {}
      additionalProperties: false
      description: In-app purchase products do not require any additional information
    CreateAppStoreConnectSubscriptionInput:
      type: object
      required:
        - duration
        - subscription_group_name
      properties:
        duration:
          type: string
          enum:
            - ONE_WEEK
            - ONE_MONTH
            - TWO_MONTHS
            - THREE_MONTHS
            - SIX_MONTHS
            - ONE_YEAR
          description: The subscription duration period
        subscription_group_name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the subscription group
        subscription_group_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: The ID of the subscription group (optional)
      additionalProperties: false
    CreateAudienceRequest:
      type: object
      required:
        - name
        - rules
      properties:
        name:
          description: The name of the Audience
          type: string
          minLength: 1
          maxLength: 256
          example: Active subscribers
        rules:
          description: The Audience membership rules
          $ref: '#/components/schemas/AudienceRules'
      additionalProperties: false
    CreateChartSubscriberListExportParams:
      type: object
      properties:
        resolution:
          description: >
            Time resolution for the chart data.

            Use the chart options endpoint to discover available resolutions and
            their IDs.
          type: string
          example: '2'
        start_date:
          description: Start date for the data range (ISO 8601 format)
          type: string
          format: date
          example: '2026-07-01'
        end_date:
          description: End date for the data range (ISO 8601 format)
          type: string
          format: date
          example: '2026-07-31'
        segment:
          description: >
            Segment the data by this dimension. Must be one of the segments
            returned

            by the chart options schema endpoint for this chart; segments vary
            per

            chart, and unsupported segments return a 400 `parameter_error`
            listing

            the supported ones.
          type: string
          example: country
        filters:
          description: >
            Filters to apply to the exported population. Available filters vary
            per

            chart; use the chart options schema endpoint to discover them.
          type: array
          items:
            type: object
            required:
              - name
              - values
            properties:
              name:
                description: The filter dimension to apply.
                type: string
                example: country
              values:
                description: Values to match for the filter dimension.
                type: array
                items:
                  type: string
                example:
                  - ES
                  - GB
            additionalProperties: false
          example:
            - name: country
              values:
                - ES
                - GB
        selectors:
          description: |
            Chart selectors, as returned by the chart options schema endpoint
            (e.g. conversion_timeframe or revenue_type).
          type: object
          additionalProperties:
            type: string
          example:
            revenue_type: proceeds
      additionalProperties: false
    CreateCustomerRequest:
      type: object
      required:
        - id
      properties:
        id:
          description: The ID of the customer
          type: string
          minLength: 1
          maxLength: 1500
          pattern: ^[0-9a-zA-Z_-]*$
          example: 19b8de26-77c1-49f1-aa18-019a391603e2
        attributes:
          type: array
          maxLength: 50
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - value
            properties:
              name:
                description: The name of the attribute
                nullable: false
                minLength: 1
                maxLength: 40
                oneOf:
                  - $ref: '#/components/schemas/CustomerAttributeReservedName'
                  - $ref: '#/components/schemas/CustomerAttributeCustomName'
                example: $email
              value:
                description: The value of the attribute
                type: string
                maxLength: 500
                nullable: false
                example: cat@revenuecat.com
      additionalProperties: false
    CreateDiscountCodesRequest:
      type: object
      required:
        - codes
      additionalProperties: false
      properties:
        codes:
          description: List of discount codes to create and attach to the discount.
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[A-Za-z0-9_]+$
            example: SPRING_2026
    CreateDiscountRequest:
      type: object
      required:
        - identifier
        - customer_facing_name
        - type
        - duration_mode
        - eligibility
      properties:
        identifier:
          description: The customizable discount identifier (developer-defined).
          type: string
          minLength: 1
          maxLength: 100
          example: spring_2026
        customer_facing_name:
          description: Name displayed to customers for this discount.
          type: string
          minLength: 3
          maxLength: 1024
          example: Spring sale
        type:
          description: The type of discount to apply.
          type: string
          enum:
            - percentage
            - fixed_amount
          example: percentage
        percentage:
          description: Percentage value for percentage discounts.
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        fixed_amounts:
          description: Fixed amount values by currency for fixed amount discounts.
          type: object
          additionalProperties:
            type: object
            required:
              - currency
              - amount
            properties:
              currency:
                type: string
                minLength: 3
                maxLength: 3
                example: USD
              amount:
                type: number
                format: double
                example: 4.99
            additionalProperties: false
        duration_mode:
          description: The discount duration mode.
          type: string
          enum:
            - one_time
            - time_window
            - forever
          example: one_time
        eligibility:
          description: Eligibility criteria for this discount.
          type: string
          enum:
            - everyone
            - never_purchased
            - never_subscribed
            - never_subscribed_to_the_same_product
          example: everyone
        time_window:
          description: ISO-8601 duration when using time window duration mode.
          type: string
          pattern: >-
            ^(-?)P(?=\d|T\d)(?:(\d+)Y)?(?:(\d+)M)?(?:(\d+)([DW]))?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$
          example: P1M
        product_identifiers:
          description: Product identifiers that this discount applies to.
          type: array
          items:
            type: string
          example:
            - com.acme.product1
            - com.acme.product2
      additionalProperties: false
    CreateEntitlementRequest:
      type: object
      required:
        - lookup_key
        - display_name
      properties:
        lookup_key:
          description: The identifier of the entitlement
          type: string
          minLength: 1
          maxLength: 200
          example: premium
        display_name:
          description: The display name of the entitlement
          type: string
          minLength: 1
          maxLength: 1500
          example: Premium access to all features
      additionalProperties: false
