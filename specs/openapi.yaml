          example: 19b8de26-77c1-49f1-aa18-019a391603e2
        project_id:
          nullable: false
          description: ID of the project to which the customer belongs
          minLength: 1
          maxLength: 20
          type: string
          example: proj1ab2c3d4
        first_seen_at:
          nullable: false
          description: >-
            The earliest date we have for this customer, whichever comes first:
            when the SDK first saw them, their first purchase, the App Store
            install date, or when the record was created. Matches the 'First
            seen or purchased' date shown in the dashboard.
          type: integer
          format: int64
          example: 1658399423658
        last_seen_at:
          nullable: true
          description: The last time the customer was seen
          type: integer
          format: int64
          example: 1658399423658
        last_seen_app_version:
          nullable: true
          description: The last app version the customer was seen on
          type: string
          example: 1.0.0
        last_seen_country:
          nullable: true
          description: The last country the customer was seen in
          type: string
          example: US
        last_seen_platform:
          nullable: true
          description: The last platform the customer was seen on
          type: string
          example: android
        last_seen_platform_version:
          nullable: true
          description: The last platform version the customer was seen on
          type: string
          example: '35'
        active_entitlements:
          description: >-
            List of the entitlements currently active for the customer. This
            property is only available in the "Get a customer" endpoint.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ListCustomerActiveEntitlements'
        experiment:
          description: The experiment enrollment object
          nullable: true
          $ref: '#/components/schemas/ExperimentEnrollment'
        attributes:
          description: >-
            List of the attributes of the customer. This is an expandable
            property, only available in the "Get a customer" endpoint.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ListCustomerAttributes'
