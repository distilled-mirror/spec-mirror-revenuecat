    IAMSettings:
      type: object
      title: IAMSettings
      required:
        - object
        - migration_mode
        - effective_migration_mode
        - anonymous_migration_mode
        - sdk_virtual_currency_spend_enabled
      properties:
        object:
          description: >-
            String representing the object's type. Objects of the same type
            share the same value.
          type: string
          enum:
            - iam_settings
          example: iam_settings
        migration_mode:
          type: string
          enum:
            - dual
            - protected
            - authenticat_only
            - null
          example: protected
          nullable: true
          description: >-
            The migration mode set for the project, or null when it was never
            set. `dual`: legacy API-key authentication and IAM both work.
            `protected`: requests made with a public API key are rejected for
            customers that are linked to an IAM user. `authenticat_only`:
            requests made with a public API key are rejected for all customers.
        effective_migration_mode:
          type: string
          enum:
            - dual
            - protected
            - authenticat_only
          example: protected
          description: The migration mode in effect. It is `dual` when no mode was set.
        anonymous_migration_mode:
          type: string
          enum:
            - disabled
            - rc_prefix
            - custom
          example: disabled
          description: >-
            Which app user ids an anonymous login may pass as `app_user_id` to
            migrate an existing customer. `disabled`: anonymous logins with an
            `app_user_id` are rejected. `rc_prefix`: only RevenueCat anonymous
            ids (prefixed with `$RCAnonymousID:`). `custom`: also ids the
            project sets itself for customers who haven't logged in. It is
            `disabled` unless you change it.
        sdk_virtual_currency_spend_enabled:
          type: boolean
          example: false
          description: >-
            Whether SDKs may spend virtual currency with a user access token. It
            is `false` unless you enable it.
      additionalProperties: true
