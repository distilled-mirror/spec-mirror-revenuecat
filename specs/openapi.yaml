    CreateProductInStoreRequest:
      type: object
      properties:
        store_information:
          description: Store-specific information for creating the product in the store
          oneOf:
            - $ref: '#/components/schemas/CreateAppStoreConnectSubscriptionInput'
            - $ref: '#/components/schemas/CreateAppStoreConnectInAppPurchaseInput'
      additionalProperties: false
    CreateProductRequest:
      type: object
      required:
        - store_identifier
        - app_id
        - type
      properties:
        store_identifier:
          description: >
            The store identifier of the product.

            - For Apple App Store products this is the product ID of the
            subscription or in-app product. To add the 12-month commitment
            (monthly billing) plan of an existing 1-year subscription, use
            '<productId>:monthly' (e.g. 'com.example.app.yearly:monthly').

            - For Google's Play Store, it should follow the format
            'productId:basePlanId' for subscription products and SKU for
            one-time purchase products.

            - For Stripe, the product identifier that always starts with
            "prod_". RevenueCat selects the active, supported default price when
            available, or the only active, supported price otherwise. If no
            price can be selected, the product is created without a web price.
            For projects that model Stripe products per price, the
            `store_identifier` in the response is the Stripe price ID when a
            price is selected.

            - For Amazon, if it's a subscription, the term SKU of the
            subscription. If it's a one-time purchase, the SKU of the product.

            - For Roku, this is the product identifier of the subscription or
            one-time purchase product.
          type: string
          minLength: 1
          maxLength: 200
          example: com.revenuecat.magicweather.monthly
        price_identifier:
          description: >-
            The Stripe price identifier to import. When provided, the price must
            exist, belong to the Stripe product, and be active and supported.
            Only supported for Stripe products.
          nullable: true
          type: string
          minLength: 1
          maxLength: 200
          example: price_1MoBy5LkdIwHu7ixZhnattbh
        app_id:
          description: The ID of the app
          type: string
          minLength: 1
          maxLength: 255
          example: app1a2b3c4
        type:
          description: The product type
          nullable: false
          $ref: '#/components/schemas/ProductType'
        display_name:
          description: The display name of the product
          nullable: true
          type: string
          minLength: 1
          maxLength: 1500
          example: Premium Monthly 2023
        subscription:
          nullable: true
          description: Subscription parameters. Only supported for test store products.
          $ref: '#/components/schemas/ProductSubscriptionInput'
        title:
          description: >-
            The user-facing title of the product. This field is required for
            Test Store products.
          nullable: true
          type: string
          minLength: 1
          maxLength: 1500
          example: Premium Monthly 2023
      additionalProperties: false
