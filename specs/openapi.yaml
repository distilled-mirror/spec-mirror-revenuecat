  /projects/{project_id}/metrics/revenue:
    get:
      summary: Get revenue for a project
      description: >-
        Returns the total revenue for the project across all of its apps for the

        given inclusive date range `[start_date, end_date]`. The value is
        expressed

        in the project's primary currency unless `currency` is provided.


        Use `revenue_type` to choose which revenue definition the `value`
        represents:

        gross `revenue` (default), `revenue_net_of_taxes`, or `proceeds` (net of
        both

        taxes and store commission — the amount the developer keeps).


        This endpoint is backed by the same realtime (v3) revenue chart that
        powers

        the dashboard. It is intended for cases where an app needs an
        authoritative

        revenue total without inferring it from the transaction list.


        Note that the most recent day in the range may be partial if it includes

        today, since transactions for today are still arriving.
         This endpoint requires the following permission(s): <code>charts_metrics:overview:read</code>. This endpoint belongs to the <strong>Charts & Metrics</strong> domain, which has a default rate limit of <strong>25 requests per minute</strong>.
      operationId: get-revenue-metric
      x-revenuecat-rate-limiting-domain: charts_metrics
      x-scopes:
        - charts_metrics:overview:read
      x-release-status: public
      tags:
        - Charts & Metrics
      parameters:
        - name: project_id
          description: ID of the project
          required: true
          in: path
          schema:
            type: string
            maxLength: 255
            example: proj1ab2c3d4
        - name: start_date
          description: Start date for the data range (ISO 8601 format)
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2024-01-01'
        - name: end_date
          description: End date for the data range (ISO 8601 format)
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2024-12-31'
        - name: currency
          description: The currency to return metrics data in
          in: query
          schema:
            type: string
            enum:
              - USD
              - EUR
              - GBP
              - AUD
              - CAD
              - JPY
              - BRL
              - KRW
              - CNY
              - MXN
              - SEK
              - PLN
              - NZD
              - CHF
          example: EUR
        - name: revenue_type
          in: query
          description: >
            Which revenue definition to return as the metric value:

            - `revenue`: gross revenue.

            - `revenue_net_of_taxes`: revenue with taxes subtracted.

            - `proceeds`: revenue net of both taxes and store commission (the
            amount the
              developer keeps).
          required: false
          schema:
            type: string
            enum:
              - revenue
              - revenue_net_of_taxes
              - proceeds
            default: revenue
          example: proceeds
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueMetric'
          headers:
            RevenueCat-Rate-Limit-Current-Usage:
              $ref: '#/components/headers/RateLimitCurrentUsage'
            RevenueCat-Rate-Limit-Current-Limit:
              $ref: '#/components/headers/RateLimitCurrentLimit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/InternalError'
