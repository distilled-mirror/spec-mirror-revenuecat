    CreateIAMOidcAuthenticationMethodRequest:
      type: object
      title: CreateIAMOidcAuthenticationMethodRequest
      required:
        - name
        - type
        - issuer_url
      properties:
        name:
          description: The display name of the authentication method.
          type: string
          example: Sign in with Google
          minLength: 1
          maxLength: 100
        type:
          description: The type of the authentication method.
          type: string
          example: oidc
          enum:
            - oidc
        issuer_url:
          description: >-
            Issuer URL of the identity provider. The OpenID configuration is
            discovered from it.
          type: string
          example: https://idp.example.com
          minLength: 1
          maxLength: 2000
        client_id:
          description: Client id expected in the `aud` claim of the ID token.
          type: string
          example: my-client-id
          maxLength: 2000
          nullable: true
        client_secret:
          description: Client secret used for interactive login. It is never returned.
          type: string
          example: my-client-secret
          maxLength: 2000
          nullable: true
        requested_scopes:
          description: >-
            OAuth scopes requested from the identity provider in addition to
            `openid`, which is always requested.
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
          example:
            - email
            - profile
        app_user_id_claim:
          description: >-
            Dot-path selector of the ID token claim used as the app user id.
            When null, the `sub` claim is used. Cannot be changed after users
            signed in.
          type: string
          example: user.id
          nullable: true
        authorization_params:
          description: >-
            Static query parameters added to the authorize URL of the identity
            provider during interactive login. OAuth and PKCE parameters cannot
            be overridden.
          type: object
          nullable: true
          additionalProperties:
            type: string
          example:
            prompt: login
        id_token_iat_freshness_seconds:
          description: >-
            Maximum age in seconds of the `iat` claim of the external ID token,
            used for replay protection. When omitted, 5 seconds are used.
          type: integer
          example: 5
          minimum: 1
          maximum: 60
          nullable: true
      additionalProperties: false
