            type: string
            minLength: 1
            maxLength: 1500
            example: 19b8de26-77c1-49f1-aa18-019a391603e2
        - name: platform
          in: query
          required: false
          description: >
            The platform to process the Customer Center configuration for. When
            provided, returns the locale-selected, platform-filtered
            configuration the customer would see. When omitted, returns the full
            unprocessed configuration for all platforms. Must match a store
            configured on this project.
          schema:
