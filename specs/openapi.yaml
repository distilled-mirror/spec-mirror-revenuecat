  /projects/{project_id}/audiences/filter_options:
    get:
      summary: Get Audience filter options
      description: >-
        Returns the known values for audience rule condition fields whose
        options are derived from the project's data (attribution fields, price
        experiments, and custom attributes). Custom attributes are returned as
        dynamic fields using the format `customAttribute:<key>`; requesting
        `customAttribute` expands to every known custom attribute. Fields with a
        fixed set of values (e.g. `country`, `platform`, `status`) are not
        served by this endpoint. This endpoint requires the following
        permission(s): <code>audiences:audiences:read</code>. This endpoint
        belongs to the <strong>Audiences</strong> domain, which has a default
        rate limit of <strong>60 requests per minute</strong>.
      operationId: get-audience-filter-options
      x-revenuecat-rate-limiting-domain: audiences
      x-scopes:
        - audiences:audiences:read
      x-release-status: public
      tags:
        - Audience
      parameters:
        - name: project_id
          description: ID of the project
          required: true
          in: path
          schema:
            type: string
            maxLength: 255
            example: proj1ab2c3d4
        - name: fields
          in: query
          description: >-
            Audience condition fields to load options for. Custom attributes use
            the field format `customAttribute:<key>`; `customAttribute` alone
            expands to every known custom attribute.
          required: true
          schema:
            type: array
            minItems: 1
            items:
              oneOf:
                - type: string
                  enum:
                    - mediaSource
                    - campaign
                    - adGroup
                    - ad
                    - keyword
                    - creative
                    - priceExperimentId
                    - latestProduct
                    - customAttribute
                - type: string
                  pattern: ^customAttribute:[a-zA-Z][a-zA-Z0-9_-]*$
              example: mediaSource
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAudienceFilterOptions'
          headers:
            RevenueCat-Rate-Limit-Current-Usage:
              $ref: '#/components/headers/RateLimitCurrentUsage'
            RevenueCat-Rate-Limit-Current-Limit:
              $ref: '#/components/headers/RateLimitCurrentLimit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
