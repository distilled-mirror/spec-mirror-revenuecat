    Discount:
      description: >-
        A RevenueCat Billing discount. These apply to RevenueCat Billing
        products only; they are not App Store, Play Store, or other store
        promotional offers.
      oneOf:
        - $ref: '#/components/schemas/DiscountPercentageVariant'
        - $ref: '#/components/schemas/DiscountFixedAmountVariant'
      discriminator:
        propertyName: type
        mapping:
          percentage: '#/components/schemas/DiscountPercentageVariant'
          fixed_amount: '#/components/schemas/DiscountFixedAmountVariant'
    DiscountCode:
      type: object
      description: A redemption code associated with a RevenueCat Billing discount.
      required:
        - object
        - code
        - created_at
      additionalProperties: false
      properties:
        object:
          description: String representing the object's type.
          type: string
          enum:
            - discount_code
        code:
          description: The discount code value.
          type: string
          minLength: 1
          maxLength: 255
          example: SPRING_2026
        created_at:
          description: >-
            Time when this discount code was created in milliseconds since
            epoch.
          type: integer
          format: int64
          example: 1712145600000
    DiscountCodes:
      type: array
      items:
        $ref: '#/components/schemas/DiscountCode'
    DiscountFixedAmountVariant:
      type: object
      description: A fixed-amount RevenueCat Billing discount.
      required:
        - object
        - id
        - identifier
        - customer_facing_name
        - type
        - duration_mode
        - eligibility
        - fixed_amount
        - created_at
        - updated_at
      properties:
        object:
          description: >-
            String representing the object's type. Objects of the same type
            share the same value.
          enum:
            - discount
          type: string
        id:
          description: The id of the RevenueCat Billing discount.
          nullable: false
          type: string
          minLength: 1
          maxLength: 255
          example: discnt1a2b3c4d5e
        identifier:
          description: The customizable discount identifier (developer-defined).
          nullable: false
          type: string
          minLength: 1
          maxLength: 100
          example: spring_2026
        customer_facing_name:
          description: Name displayed to customers for this discount.
          nullable: false
          type: string
          minLength: 1
          maxLength: 1024
          example: Spring sale
        type:
          description: The type of discount to apply.
          nullable: false
          type: string
          enum:
            - fixed_amount
          example: fixed_amount
        duration_mode:
          description: The discount duration mode.
          nullable: false
          type: string
          enum:
            - one_time
            - time_window
            - forever
          example: one_time
        eligibility:
          description: Eligibility criteria for this discount.
          nullable: false
          type: string
          enum:
            - everyone
            - never_purchased
            - never_subscribed
            - never_subscribed_to_the_same_product
          example: everyone
        time_window:
          description: ISO-8601 duration when using time window duration mode.
          nullable: true
          type: string
          pattern: >-
            ^(-?)P(?=\d|T\d)(?:(\d+)Y)?(?:(\d+)M)?(?:(\d+)([DW]))?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$
          example: P1M
        disabled_at:
          description: Timestamp in ms since epoch when the discount was disabled.
          nullable: true
          type: integer
          format: int64
          example: 1762273200000
        fixed_amount:
          description: Fixed discount amounts keyed by currency code.
          nullable: false
          type: object
          additionalProperties:
            type: number
            format: double
          example:
            USD: 4.99
            EUR: 3.99
        created_at:
          description: The date the discount was created at in ms since epoch.
          nullable: false
          type: integer
          format: int64
          example: 1762270200000
        updated_at:
          description: The date the discount was updated at in ms since epoch.
          nullable: false
          type: integer
          format: int64
          example: 1762270200000
      additionalProperties: false
    DiscountPercentageVariant:
      type: object
      description: A percentage-based RevenueCat Billing discount.
      required:
        - object
        - id
        - identifier
        - customer_facing_name
        - type
        - duration_mode
        - eligibility
        - percentage
        - created_at
        - updated_at
      properties:
        object:
          description: >-
            String representing the object's type. Objects of the same type
            share the same value.
          enum:
            - discount
          type: string
        id:
          description: The id of the RevenueCat Billing discount.
          nullable: false
          type: string
          minLength: 1
          maxLength: 255
          example: discnt1a2b3c4d5e
        identifier:
          description: The customizable discount identifier (developer-defined).
          nullable: false
          type: string
          minLength: 1
          maxLength: 100
          example: spring_2026
        customer_facing_name:
          description: Name displayed to customers for this discount.
          nullable: false
          type: string
          minLength: 1
          maxLength: 1024
          example: Spring sale
        type:
          description: The type of discount to apply.
          nullable: false
          type: string
          enum:
            - percentage
          example: percentage
        duration_mode:
          description: The discount duration mode.
          nullable: false
          type: string
          enum:
            - one_time
            - time_window
            - forever
          example: one_time
        eligibility:
          description: Eligibility criteria for this discount.
          nullable: false
          type: string
          enum:
            - everyone
            - never_purchased
            - never_subscribed
            - never_subscribed_to_the_same_product
          example: everyone
        time_window:
          description: ISO-8601 duration when using time window duration mode.
          nullable: true
          type: string
          pattern: >-
            ^(-?)P(?=\d|T\d)(?:(\d+)Y)?(?:(\d+)M)?(?:(\d+)([DW]))?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$
          example: P1M
        disabled_at:
          description: Timestamp in ms since epoch when the discount was disabled.
          nullable: true
          type: integer
          format: int64
          example: 1762273200000
        percentage:
          description: Percentage value for percentage discounts (1–100).
          nullable: false
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        created_at:
          description: The date the discount was created at in ms since epoch.
          nullable: false
          type: integer
          format: int64
          example: 1762270200000
        updated_at:
          description: The date the discount was updated at in ms since epoch.
          nullable: false
          type: integer
          format: int64
          example: 1762270200000
      additionalProperties: false
    DuplicatePaywallRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          description: >-
            Optional name for the duplicated paywall. Defaults to the original
            paywall's name with a "Copy" suffix.
          type: string
          minLength: 1
          maxLength: 255
          example: Main Paywall Copy
        source_version:
          description: >-
            Which version of the source paywall to duplicate: the current draft
            (default) or the currently published version. The duplicate is
            always created as an unpublished draft. Fails with a conflict if
            `published` is requested and the paywall is not currently published.
          type: string
          enum:
            - draft
            - published
          default: draft
          example: published
        offering:
          description: >-
            Optional. When provided, the source paywall's offering is duplicated
            (packages only, without its own checkout config or paywall) and the
            duplicated paywall is attached to it. Omit to leave the duplicated
            paywall detached from any offering. Fails with a conflict if the
            source paywall is not associated with an offering.
          type: object
          required:
            - lookup_key
            - display_name
          properties:
            lookup_key:
              description: The custom identifier of the duplicated offering
              type: string
              minLength: 1
              maxLength: 200
              example: default
            display_name:
              description: The display name of the duplicated offering
              type: string
              minLength: 1
              maxLength: 1500
              example: The standard set of packages
          additionalProperties: false
    Duration:
      type: string
      description: >-
        The duration of the product subscription. This field is only supported
        for the test store and it is ignored for other stores.
      nullable: false
      example: P1W
      enum:
        - P1W
        - P1M
        - P2M
        - P3M
        - P6M
        - P1Y
    EligibilityCriteria:
      type: string
      nullable: false
      enum:
        - all
        - google_sdk_lt_6
        - google_sdk_ge_6
    Entitlement:
      type: object
      required:
        - project_id
        - id
        - lookup_key
        - display_name
        - state
        - created_at
        - object
      properties:
        state:
          description: Whether the entitlement is active or inactive (archived).
          nullable: false
          type: string
          enum:
            - active
            - inactive
          example: active
        object:
          description: >-
            String representing the object's type. Objects of the same type
            share the same value.
          enum:
            - entitlement
          type: string
        project_id:
          nullable: false
          description: ID of the project to which the entitlement belongs
          minLength: 1
          maxLength: 20
          type: string
          example: proj1ab2c3d4
        id:
          description: The id of the entitlement
          nullable: false
          type: string
          minLength: 1
          maxLength: 255
          example: entla1b2c3d4e5
        lookup_key:
          description: A custom identifier of the entitlement
          nullable: false
          type: string
          minLength: 1
          maxLength: 200
          example: premium
        display_name:
          description: The display name of the entitlement
          nullable: false
          type: string
          minLength: 1
          maxLength: 1500
          example: Premium
        created_at:
          nullable: false
          type: integer
          format: int64
          description: The date when the entitlement was created in ms since epoch
          example: 1658399423658
        products:
          description: List of products attached to the entitlement
          nullable: true
          required:
            - items
            - next_page
            - object
            - url
          title: ProductsList
          type: object
          properties:
            object:
              description: >-
                String representing the object's type. Objects of the same type
                share the same value. Always has the value `list`.
              enum:
                - list
              type: string
            items:
              description: Details about each object.
              items:
                $ref: '#/components/schemas/Product'
              type: array
            next_page:
              description: >-
                URL to access the next page of the Entitlement's products. If
                not present / null, there is no next page
              type: string
              nullable: true
              example: >-
                /v2/projects/proj1ab2c3d4/entitlements/entle1a2b3c4d5/products?starting_after=prodeab21dac
            url:
              description: The URL where this list can be accessed.
              maxLength: 5000
              type: string
              example: /v2/projects/proj1ab2c3d4/entitlements/entle1a2b3c4d5/products
      additionalProperties: false
    EntityReferencesArchivedEntitiesError:
      description: >-
        Error returned when attempting to make an entity active, but that entity
        references other entities that are currently inactive (archived). The
        `referenced_object_ids` field lists the IDs of the inactive entities
        that must be made active first.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - referenced_object_ids
          properties:
            type:
              type: string
              enum:
                - entity_references_archived_entities
            referenced_object_ids:
              description: >-
                The IDs of the archived (inactive) entities that need to be made
                active before this operation can succeed.
              type: array
              items:
                type: string
              example:
                - prodabcd1234
                - prodwxyz5678
    Environment:
      type: string
      description: The store environment
      example: production
      nullable: false
      enum:
        - production
        - sandbox
    Error:
      type: object
      required:
        - type
        - message
        - retryable
        - object
      properties:
        object:
          description: >-
            String representing the object's type. Objects of the same type
            share the same value.
          enum:
            - error
          type: string
          example: error
        type:
          description: The error type
          type: string
          nullable: false
          enum:
            - parameter_error
            - resource_already_exists
            - resource_missing
            - idempotency_error
            - rate_limit_error
            - authentication_error
            - authorization_error
            - store_error
            - server_error
            - resource_locked_error
            - unprocessable_entity_error
            - invalid_request
            - entity_references_archived_entities
          example: parameter_error
        param:
          description: >-
            If the error is parameter-specific, the parameter related to the
            error
          type: string
          nullable: true
          example: customer_id
        doc_url:
          description: A URL to more information about the error reported
          type: string
          nullable: false
          example: https://errors.rev.cat/parameter-error
        message:
          type: string
          description: A message describing the reason of the error
          nullable: false
          example: id shouldn't be longer than 1,500 characters
        retryable:
          description: Indicates if the error is retryable or not
          type: boolean
          nullable: false
          example: false
        backoff_ms:
          description: >-
            The ms the client should wait before retrying the request. Only
            present for retryable errors.
          type: integer
          nullable: true
          example: null
        referenced_object_ids:
          description: >-
            The IDs of related objects relevant to the error, such as the
            archived entities that need to be made active before the operation
            can succeed.
          type: array
          items:
            type: string
          example:
            - prodabcd1234
            - prodwxyz5678
      additionalProperties: false
    ExperimentEnrollment:
      type: object
      required:
        - id
        - name
        - variant
        - object
      nullable: true
      properties:
        object:
          description: >-
            String representing the object's type. Objects of the same type
            share the same value.
          enum:
            - experiment_enrollment
          type: string
        id:
          type: string
          maxLength: 1500
        name:
          type: string
          maxLength: 1500
        variant:
          nullable: false
          description: >-
            The variant of the Experiment that the Customer was or is assigned
            to, where 'a' represents the Control, and 'b' represents the
            Treatment.
          minLength: 1
          maxLength: 1
          type: string
          example: a
      additionalProperties: false
    ExtendSubscriptionByDuration:
      type: object
      additionalProperties: false
      required:
        - extend_by_days
      properties:
        extend_by_days:
          type: integer
          minimum: 1
          description: |
            Number of days to extend the current billing period by.
            For Apple Store subscriptions, the maximum allowed value is 90.
          example: 14
        extend_reason_code:
          type: string
          enum:
            - undeclared
            - customer_satisfaction
            - other
            - service_issue_or_outage
          description: |
            Reason for the extension. Required for Apple Store subscriptions;
            ignored for Google Play and Web Billing subscriptions.
          example: customer_satisfaction
    ExtendSubscriptionRequest:
      oneOf:
        - $ref: '#/components/schemas/ExtendSubscriptionByDuration'
        - $ref: '#/components/schemas/ExtendSubscriptionUntilDate'
    ExtendSubscriptionUntilDate:
      type: object
      additionalProperties: false
      required:
        - extend_until_ms
      properties:
        extend_until_ms:
          type: integer
          format: int64
          description: >
            Absolute epoch timestamp (in milliseconds) to which the current
            billing

            period should be extended. Must be after the subscription's current

            `current_period_ends_at`. For Apple Store subscriptions, the
            resulting

            extension cannot exceed 90 days.
