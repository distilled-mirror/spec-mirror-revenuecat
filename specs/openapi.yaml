          type: string
          minLength: 1
          maxLength: 255
          example: pw123456789abcdef
        name:
          description: The name of the paywall
          nullable: true
          type: string
          minLength: 1
          maxLength: 255
          example: My Awesome Paywall
        offering_id:
          description: The ID of the offering the paywall is for.
          nullable: true
          type: string
          minLength: 1
          maxLength: 255
          example: ofrng123456789a
        created_at:
          description: The date the paywall was created at in ms since epoch
          nullable: false
          type: integer
          format: int64
          example: 1658399423658
        published_at:
          description: The date the paywall was published at in ms since epoch
          nullable: true
          type: integer
          format: int64
          example: 1658399423958
        automatically_scale_font_size:
          description: Whether font sizes should automatically scale for this paywall.
          nullable: false
          type: boolean
          default: true
          example: true
        revision:
          description: >-
            The paywall's current revision. Used on updates to reject stale
            writes (if another update has bumped the revision in the meantime).
          nullable: false
          type: integer
          format: int64
          example: 3
        offering:
          description: The offering associated with this paywall. Expandable.
          nullable: true
          $ref: '#/components/schemas/Offering'
        components:
          description: >-
            Published and draft components configurations for this paywall.
            Expandable.
          nullable: true
          $ref: '#/components/schemas/PaywallComponents'
      additionalProperties: false
    PaywallComponents:
      type: object
      required:
        - published
        - draft
      properties:
        published:
          description: >-
            The currently published version of the paywall. Null if the paywall
            has never been published.
          nullable: true
          $ref: '#/components/schemas/PaywallComponentsVersion'
        draft:
          description: >-
            The draft version of the paywall if there are unpublished changes.
            Null if there are no unpublished changes.
          nullable: true
          $ref: '#/components/schemas/PaywallComponentsVersion'
      additionalProperties: false
    PaywallComponentsVersion:
      description: >-
        A specific version (published or draft) of a paywall's components
        configuration.
      type: object
      nullable: true
      required:
        - revision
        - components_config
        - default_locale
        - components_localizations
        - automatically_scale_font_size
        - state_declarations
      properties:
        revision:
          description: The revision number of this version.
          type: integer
          nullable: true
          example: 1
        components_config:
          description: >-
            The raw, schemaless JSON payload for paywall components
            configuration.
          type: object
          nullable: true
          additionalProperties: true
          example:
            base:
              stack:
                id: l7Ylx2UZeA
                type: stack
                components:
                  - id: LFVZUCf9yW
                    type: text
                    text_lid: OBUxLwsvXb
              sticky_footer:
                id: UJJRRPzRuz
                type: footer
        default_locale:
          description: The default locale for the paywall.
          type: string
          nullable: true
          example: en_US
        components_localizations:
          description: Localized values keyed by locale code.
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            en_US:
              title: Premium
        automatically_scale_font_size:
          description: Whether font sizes should automatically scale for this paywall.
          type: boolean
          default: true
          example: true
        state_declarations:
          description: >-
            State declarations for this version, keyed by state key name. An
            empty object when the paywall has no state declarations; null for
            paywalls not written to since before state declarations were
            introduced.
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/StateDeclaration'
          example:
            selectedPackage:
              type: string
              default: monthly
        fonts:
          description: >-
            Font objects used by the published paywall components. Only present
            on published versions.
          type: object
          nullable: true
          additionalProperties: true
          example:
            CustomFont:
              src: https://example.com/font.ttf
      additionalProperties: false
    PaywallDraftCreate:
      type: object
      required:
        - components_config
        - components_localizations
      properties:
        offering_id:
          description: >
            The optional ID of the offering the paywall draft will be attached
            to.
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          example: ofrng123456789a
        name:
          description: Optional paywall name.
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          example: Main Paywall
        components_config:
          description: The raw paywall components configuration to save as the draft.
          type: object
          additionalProperties: true
          example:
            base:
              stack:
                id: main_stack
                type: stack
                components: []
        components_localizations:
          description: Localized component values keyed by locale.
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            en_US:
              title: Premium
        default_locale:
          description: The default locale for this paywall. Defaults to en_US.
          type: string
          minLength: 1
          maxLength: 255
          default: en_US
          example: en_US
        automatically_scale_font_size:
          description: >-
            Whether font sizes should automatically scale for this paywall.
            Defaults to true.
          type: boolean
          default: true
          example: true
      additionalProperties: false
    PaywallDraftUpdate:
      type: object
      additionalProperties: false
      required:
        - revision
      properties:
        revision:
          description: >-
            The current revision of the paywall, as returned in the `revision`
            field of any paywall response. Used to reject stale writes: if
            another update has bumped the revision in the meantime, this request
            fails with a 409.
          type: integer
          format: int64
          example: 3
        components_config:
          description: |
            The raw paywall components configuration to save as the draft.
            Omit to leave unchanged.
          type: object
          additionalProperties: true
          example:
            base:
              stack:
                id: main_stack
                type: stack
                components: []
        components_localizations:
          description: |
            Localized component values keyed by locale. Omit to leave unchanged.
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            en_US:
              title: Premium
        default_locale:
          description: |
            The default locale for this paywall. Omit to leave unchanged.
          type: string
          minLength: 1
          maxLength: 255
          example: en_US
        offering_id:
          description: >
            The ID of the offering to attach this paywall to. Pass null to
            detach

            the paywall from its offering (not supported while the paywall is

            published). Omit the field to leave it unchanged.
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          example: ofrng123456789a
        name:
          description: Optional paywall name.
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          example: Main Paywall
        automatically_scale_font_size:
          description: >-
            Whether font sizes should automatically scale for this paywall
            draft.
          type: boolean
          example: true
        exit_offers:
          description: Exit offer configuration to save on the draft.
          type: object
          nullable: true
          additionalProperties: true
          example:
            dismiss:
              offering_id: ofrng123456789abcdef
        state_declarations:
          description: |
            State declarations to save on the draft, keyed by state key name.
            Pass null to clear all state declarations. Omit to leave unchanged.
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/StateDeclarationInput'
          example:
            selectedPackage:
              type: string
              default: monthly
        play_store_product_change_mode:
          description: Play Store product change mode configuration to save on the draft.
          type: object
          nullable: true
          additionalProperties: true
          example:
            upgrade_replacement_mode: deferred
    PaywallVersion:
      type: object
      required:
        - id
        - name
        - revision
        - created_at
        - components_config
        - components_localizations
        - default_locale
        - automatically_scale_font_size
        - exit_offers
        - state_declarations
        - play_store_product_change_mode
        - object
      properties:
        object:
          description: >-
            String representing the object's type. Objects of the same type
            share the same value.
          enum:
            - paywall_version
          type: string
        id:
          description: The id of the paywall version.
          type: string
          minLength: 1
          maxLength: 255
          example: pwv123456789abcdef
        name:
          description: The name of the paywall version.
          type: string
          minLength: 1
          maxLength: 255
          example: Before AI edit
        revision:
          description: The paywall revision captured by this version.
          type: integer
          example: 3
        created_at:
          description: The date the paywall version was created at in ms since epoch.
          type: integer
          format: int64
          example: 1658399423658
        components_config:
          description: The raw paywall components configuration captured by this version.
          type: object
          nullable: true
          additionalProperties: true
          example:
            base:
              stack:
                id: main_stack
                type: stack
                components: []
        components_localizations:
          description: Localized component values keyed by locale.
          type: object
          nullable: true
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            en_US:
              title: Premium
        default_locale:
          description: The default locale captured by this version.
          type: string
          nullable: true
          example: en_US
        automatically_scale_font_size:
          description: >-
            Whether font sizes should automatically scale for this paywall
            version.
          type: boolean
          example: true
        exit_offers:
          description: Exit offer configuration captured by this version.
          type: object
          nullable: true
          additionalProperties: true
          example:
            dismiss:
              offering_id: ofrng123456789abcdef
        state_declarations:
          description: >-
            State declarations captured by this version, keyed by state key
            name.
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/StateDeclaration'
          example:
            selectedPackage:
              type: string
              default: monthly
        play_store_product_change_mode:
          description: >-
            Play Store product change mode configuration captured by this
            version.
          type: object
          nullable: true
          additionalProperties: true
          example:
            upgrade_replacement_mode: deferred
      additionalProperties: true
    PlayStoreApp:
      type: object
      required:
        - object
        - id
        - name
        - type
        - created_at
        - project_id
        - custom_url_scheme
        - play_store
      properties:
        object:
          description: >-
            String representing the object's type. Objects of the same type
            share the same value.
          enum:
            - app
          type: string
        id:
          description: The id of the app
          nullable: false
          type: string
          minLength: 1
          maxLength: 255
          example: app1a2b3c4
        name:
          description: The name of the app
          nullable: false
          type: string
          minLength: 1
          maxLength: 255
        created_at:
          description: The date when the app was created in ms since epoch
          nullable: false
          type: integer
          format: int64
          example: 1658399423658
        type:
          description: The platform of the app
          nullable: false
          type: string
          enum:
            - play_store
          example: play_store
        project_id:
          description: The id of the project
          nullable: false
          type: string
          minLength: 1
          maxLength: 255
          example: proj1a2b3c4
        custom_url_scheme:
          description: The custom URL scheme for the app, derived from the app's public ID.
          type: string
          nullable: false
          example: rc-1a2b3c4
        play_store:
          description: Play Store type details
          type: object
          required:
            - package_name
            - play_service_account_credentials_configured
          nullable: false
          additionalProperties: true
          properties:
            package_name:
              description: The package name of the app
              type: string
              nullable: true
              minLength: 1
              maxLength: 256
            play_service_account_credentials_configured:
              description: Whether Google Play service account credentials are configured.
              type: boolean
              nullable: false
              example: true
            custom_url_scheme:
              description: >-
                The custom URL scheme for the app, derived from the app's public
                ID.
              type: string
              nullable: false
              example: rc-1a2b3c4
      additionalProperties: true
    PlayStoreAppCreate:
      type: object
      required:
        - name
        - type
        - play_store
      properties:
        name:
          description: The name of the app
          type: string
          minLength: 1
          maxLength: 255
          nullable: false
        type:
          description: >
            The platform of the app.

            Mac App Store is disabled by default. See [Legacy Mac
            Apps](https://www.revenuecat.com/docs/legacy-mac-apps) for more
            details.
          type: string
          enum:
            - play_store
          nullable: false
        play_store:
          description: >-
            Play Store type details. Should only be used when type is
            play_store.
          type: object
          required:
            - package_name
          nullable: false
          properties:
            package_name:
              description: The package name of the app
              type: string
              minLength: 1
              maxLength: 256
              nullable: false
            play_service_account_credentials_json:
              description: >
                Contents of the Google Cloud service account key JSON file. Copy
                the whole file into

                this field. See instructions on how to create it in:

                https://www.revenuecat.com/docs/creating-play-service-credentials
              type: string
              minLength: 1
              maxLength: 8192
              nullable: false
          additionalProperties: false
      additionalProperties: false
    PreviewAudienceRequest:
      oneOf:
