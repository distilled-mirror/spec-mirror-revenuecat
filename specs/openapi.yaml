            The role of the collaborator. The project owner is included in the
            list with the role `owner`.
          nullable: false
          type: string
          enum:
            - owner
            - admin
            - read_only
            - customer_support
            - developer
            - growth_specialist
            - operations
            - revenuecat
          example: admin
        accepted_at:
